[package]
name = "lockbox-crypto"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
curve25519-dalek = "5.0.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "pem"] }
rand = "0.10.3"
sha2 = { version = "0.11.1", features = ["zeroize"] }
thiserror = "2.0.21"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
