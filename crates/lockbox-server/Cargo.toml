[package]
name = "lockbox-server"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
lockbox-protocol = { version = "0.1.0", path = "../lockbox-protocol" }
rand = "0.10.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util"] }
