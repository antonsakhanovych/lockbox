[package]
name = "lockbox-protocol"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
curve25519-dalek = "5.0.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "pem", "serde"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.1", features = ["zeroize"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util"] }
