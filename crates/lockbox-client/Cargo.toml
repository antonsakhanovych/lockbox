[package]
name = "lockbox-client"
version.workspace = true
edition.workspace = true

[dependencies]
lockbox-protocol = { version = "0.1.0", path = "../lockbox-protocol" }
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "time"] }

[dev-dependencies]
lockbox-server = { version = "0.1.0", path = "../lockbox-server" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
